name: Docs deploy

# Docs are authored here but published from loopedautomation/docs (docs.looped.sh),
# which pulls docs/ + MANIFESTO.md at build time. This triggers that build.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "MANIFESTO.md"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger docs.looped.sh rebuild
        run: curl -sf -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}"
