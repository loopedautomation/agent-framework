name: Publish base image

on:
  push:
    branches: [main]
    paths:
      - images/**
      - packages/**
      - deno.json
      - deno.lock
      - .github/workflows/publish-image.yml
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/loopedautomation/agent:latest
            ghcr.io/loopedautomation/agent:${{ github.sha }}
          # Multi-arch pushes produce an OCI index; GHCR reads the package
          # description from the index annotation, not the per-arch labels.
          annotations: |
            index:org.opencontainers.image.description=The Looped AF base agent image: Deno, the framework, and the native tools — hardened, non-root, health-checked. An agent is a file: mount your agent.yaml and run.
            index:org.opencontainers.image.source=https://github.com/loopedautomation/agent-framework
            index:org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
