name: Publish base image

# Images are born on release, exactly like the JSR packages published from
# the same event:
#   :X.Y.Z, :X.Y, :X — immutable, built once from the tagged commit
#   :latest          — moves to the newest release
# The CLI pins its default image to :X.Y.Z (packages/cli/docker.ts).
# workflow_dispatch pushes only :<sha> — a test build, no channel moves.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: tags
        run: |
          IMAGE=ghcr.io/loopedautomation/agent
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            V="${GITHUB_REF_NAME#v}"
            SRC=$(grep -o 'VERSION = "[^"]*"' packages/core/mod.ts | cut -d'"' -f2)
            # The released CLI pulls :$SRC by default — a mismatched tag would
            # publish a CLI whose image doesn't exist. Fail before pushing anything.
            if [[ "$V" != "$SRC" ]]; then
              echo "release tag $V != VERSION $SRC in packages/core/mod.ts" >&2
              exit 1
            fi
            echo "tags=$IMAGE:$V,$IMAGE:${V%.*},$IMAGE:${V%%.*},$IMAGE:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMAGE:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Multi-arch pushes produce an OCI index; GHCR reads the package
          # description from the index annotation, not the per-arch labels.
          annotations: |
            index:org.opencontainers.image.description=The Looped AF base agent image: Deno, the framework, and the native tools — hardened, non-root, health-checked. An agent is a file: mount your agent.yaml and run.
            index:org.opencontainers.image.source=https://github.com/loopedautomation/agent-framework
            index:org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
