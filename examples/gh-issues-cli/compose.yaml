# The whole deployment story: docker compose up -d
#
# .env next to this file (see .env.example):
#   OPENAI_API_KEY, DISCORD_BOT_TOKEN, GITHUB_TOKEN
services:
  gh-issues-cli:
    build:
      context: ../..
      dockerfile: examples/gh-issues-cli/Dockerfile
    env_file: .env
    volumes:
      - gh-issues-cli-data:/data
    ports:
      # Status surface: curl localhost:9090/healthz
      # If host port 9090 is taken, change only the left side (e.g. "127.0.0.1:9091:9090").
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

volumes:
  gh-issues-cli-data:
