# yaml-language-server: $schema=https://looped.sh/schema/agent.json
# The same job as gh-issues-cli (Discord message in, GitHub issue link out),
# with the GitHub tools coming from an MCP server instead of the gh CLI.
# Compare the two side by side to pick an approach for your own agent.
handle: gh-issues-mcp
description: Turns team Discord messages into GitHub issues, via the GitHub MCP server.

model:
  provider: openai-compatible
  id: gpt-5.4-mini
  small: gpt-5.4-mini
  api_key_env: OPENAI_API_KEY

purpose: |
  You manage GitHub issues for the team's repository. When someone
  describes work or a bug, create an issue with a clear, searchable
  title and a body that captures everything they said. Apply labels
  when obvious. Reply with only the issue link and a one-line summary.
  For other issue-management requests (close, label, query), do them
  and confirm briefly. If a message isn't an issue request, stay silent.

triggers:
  - type: discord
    channels: ["issues"]

tools:
  mcp:
    - name: github
      # The base image's sandbox only lets the runtime spawn bash, so the
      # server is launched through it. The Dockerfile installs the binary.
      command: ["bash", "-c", "exec /usr/local/bin/github-mcp-server stdio"]
      env:
        GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN} # reference — resolved at runtime, scoped to this server
      # The full server ships ~100 tools; expose only what the job needs.
      include: [issue_write, issue_read, list_issues, search_issues, add_issue_comment]

permissions:
  net: [discord.com, gateway.discord.gg]

memory:
  scope: thread

limits:
  max_steps: 10
