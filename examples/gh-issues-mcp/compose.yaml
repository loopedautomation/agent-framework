# The whole deployment story: docker compose up -d
#
# .env next to this file (see .env.example):
#   OPENAI_API_KEY, DISCORD_BOT_TOKEN, GITHUB_TOKEN
services:
  gh-issues-mcp:
    build:
      context: ../..
      dockerfile: examples/gh-issues-mcp/Dockerfile
    env_file: .env
    volumes:
      - gh-issues-mcp-data:/data
    ports:
      # Status surface: curl localhost:9091/healthz
      # 9091 on the host so this can run next to gh-issues-cli (which takes 9090).
      - "127.0.0.1:9091:9090"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

volumes:
  gh-issues-mcp-data:
