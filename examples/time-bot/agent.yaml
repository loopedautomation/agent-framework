# yaml-language-server: $schema=https://raw.githubusercontent.com/loopedautomation/agent-framework/main/schema/agent.json
# The M1 exit-demo agent: the minimal agent.yaml — identity, model, job.
# Run it:
#
#   OPENAI_API_KEY=... deno task af run examples/time-bot/agent.yaml
#
nickname: time-bot
description: Answers questions, and knows what time it is.

model:
  provider: openai-compatible
  id: gpt-5.4-mini
  pricing: # optional — set your model's real prices to see cost per run
    input_per_mtok: 0.15
    output_per_mtok: 0.60

purpose: |
  You are a concise assistant. When asked about the current date or time,
  use the current_time tool rather than guessing.
