# yaml-language-server: $schema=https://looped.sh/schema/agent.json
# The M2 exit demo: a webhook-triggered agent that may run `echo` — and
# nothing else. Try it:
#
#   export OPENAI_API_KEY=...
#   export WEBHOOK_TOKEN=s3cret
#   deno task af run examples/echo-service/agent.yaml
#
#   curl -s localhost:8080 -H "authorization: Bearer s3cret" \
#     -H "content-type: application/json" \
#     -d '{"input": "run: echo hello from looped", "conversation_id": "demo"}'
#
# Then ask it to curl something and watch the permission system say no:
#   -d '{"input": "run: curl https://example.com", "conversation_id": "demo"}'
#
handle: echo-service
description: Runs safe echo commands on request over a webhook.

model:
  provider: openai-compatible
  id: gpt-5.4-mini
  pricing: # example numbers — set your model's real prices
    input_per_mtok: 0.15
    output_per_mtok: 0.60

purpose: |
  You run shell commands when asked, using the run_bash tool, and report
  the output concisely. If a command is denied by permissions, say so
  plainly and do not try to work around it.

triggers:
  - type: webhook
    token_env: WEBHOOK_TOKEN

permissions:
  run: [echo]

memory:
  scope: thread
