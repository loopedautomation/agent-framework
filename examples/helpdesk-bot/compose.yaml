# The whole deployment story: docker compose up -d
#
# No Dockerfile and no published trigger port: the IMAP transport polls
# the mailbox outward, so nothing on the internet needs to reach this
# container.
#
# .env next to this file (see .env.example):
#   OPENAI_API_KEY, IMAP_PASSWORD
services:
  helpdesk-bot:
    image: ghcr.io/loopedautomation/agent:latest
    env_file: .env
    volumes:
      - ./agent.yaml:/agent/agent.yaml:ro
      # The team's knowledge base, conversation history and audit trail.
      - helpdesk-bot-data:/data
    ports:
      # Status surface: curl localhost:9095/healthz
      # 9095 on the host so this can run next to the other examples.
      - "127.0.0.1:9095:9090"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

volumes:
  helpdesk-bot-data:
