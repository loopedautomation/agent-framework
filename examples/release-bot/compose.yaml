# The whole deployment story: docker compose up -d
#
# .env next to this file (see .env.example):
#   CLAUDE_CODE_OAUTH_TOKEN, GH_TOKEN, TELEGRAM_BOT_TOKEN
services:
  release-bot:
    build:
      context: ../..
      dockerfile: examples/release-bot/Dockerfile
    env_file: .env
    volumes:
      - release-bot-data:/data
    ports:
      # Status surface: curl localhost:9095/healthz
      - "127.0.0.1:9095:9090"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

volumes:
  release-bot-data:
