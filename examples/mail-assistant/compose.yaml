# The whole deployment story: docker compose up -d --build
#
# .env next to this file (see .env.example):
#   OPENAI_API_KEY, RESEND_API_KEY, RESEND_WEBHOOK_SECRET, CALENDAR_ICS_URL
services:
  mail-assistant:
    build:
      context: ../..
      dockerfile: examples/mail-assistant/Dockerfile
    env_file: .env
    volumes:
      - mail-assistant-data:/data
    ports:
      # The email trigger's webhook endpoint. Resend needs to reach it over
      # HTTPS, so put a TLS-terminating proxy or tunnel in front.
      - "8080:8080"
      # Status surface: curl localhost:9092/healthz
      # 9092 on the host so this can run next to the gh-issues examples.
      - "127.0.0.1:9092:9090"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

volumes:
  mail-assistant-data:
