# The whole deployment story: docker compose up -d
#
# .env next to this file (see .env.example):
#   OPENAI_API_KEY, DISCORD_BOT_TOKEN, GITHUB_TOKEN, TTY_TOKEN
services:
  gh-issues-bot:
    build:
      context: ../..
      dockerfile: examples/gh-issues-bot/Dockerfile
    env_file: .env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - TTY_TOKEN=${TTY_TOKEN}
    volumes:
      - gh-issues-bot-data:/data
    # No host port bindings: Coolify's proxy reaches the container over the
    # internal network. Set "Ports Exposes" to 8090 and attach your domain —
    # clients then connect via wss://<domain>/tty (bearer auth via TTY_TOKEN).
    expose:
      # TTY trigger WebSocket
      - "8090"
      # Status surface (internal health checks: /healthz)
      - "9090"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

volumes:
  gh-issues-bot-data:
