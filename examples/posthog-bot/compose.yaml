# The whole deployment story: docker compose up -d
#
# .env next to this file (see .env.example):
#   OPENAI_API_KEY, TELEGRAM_BOT_TOKEN, POSTHOG_API_KEY, POSTHOG_PROJECT_ID, TTY_TOKEN
services:
  posthog-bot:
    image: ghcr.io/loopedautomation/agent:latest
    env_file: .env
    volumes:
      - ./agent.yaml:/agent/agent.yaml:ro
      # agent.yaml references the skill as ../../skills/posthog.md,
      # which resolves to /skills inside the container.
      - ../../skills/posthog.md:/skills/posthog.md:ro
      - posthog-bot-data:/data
    ports:
      # TTY trigger WebSocket: ws://localhost:8090/tty (bearer auth via TTY_TOKEN)
      - "127.0.0.1:8090:8090"
      # Status surface: curl localhost:9095/healthz
      - "127.0.0.1:9095:9090"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

volumes:
  posthog-bot-data:
